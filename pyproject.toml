[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "biosphere-atlas"
version = "0.1.0"
description = "Unified BiosphereAtlas toolkit: chimera detection, HPLG classification, placement, and tree construction"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Sentry Bio, Inc.", email = "research@sentry.bio" }]
dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "biopython>=1.80",
    "tqdm",
]

[project.optional-dependencies]
geoopt = ["geoopt>=0.5.0"]
dev = ["pytest>=7.0", "pytest-cov", "ruff"]

[project.scripts]
atlas-chimera = "biosphere_atlas.chimera.cli:main"
atlas-hplg = "biosphere_atlas.hplg.cli:main"
atlas-place = "biosphere_atlas.place.cli:main"
atlas-tree = "biosphere_atlas.tree.cli:main"
atlas-novelty = "biosphere_atlas.novelty.cli:main"
atlas-dark = "biosphere_atlas.dark.cli:main"
atlas-viewer = "biosphere_atlas.viewer.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

