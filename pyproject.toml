[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "biosphere-atlas"
version = "1.0.0"
description = "Unified BiosphereAtlas toolkit — geometric genomics tools for the tree of life"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.9"
authors = [{ name = "Sentry Bio, Inc.", email = "research@sentry.bio" }]
keywords = ["genomics", "hyperbolic", "phylogenetics", "metagenomics", "bioinformatics"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
    "torch>=2.0",
    "numpy>=1.24",
    "biopython>=1.80",
    "tqdm",
]

[project.optional-dependencies]
geoopt   = ["geoopt>=0.5.0"]
plotly   = ["plotly>=5.0"]     # for atlas-viewer --mode 3d
dev      = ["pytest>=7.0", "pytest-cov", "ruff"]
all      = ["geoopt>=0.5.0", "plotly>=5.0"]

[project.urls]
Homepage   = "https://github.com/sentry-bio/atlas-tool-package"
Repository = "https://github.com/sentry-bio/atlas-tool-package"
Issues     = "https://github.com/sentry-bio/atlas-tool-package/issues"

[project.scripts]
atlas-place   = "biosphere_atlas.place.cli:main"
atlas-tree    = "biosphere_atlas.tree.cli:main"
atlas-chimera = "biosphere_atlas.chimera.cli:main"
atlas-hplg    = "biosphere_atlas.hplg.cli:main"
atlas-novelty = "biosphere_atlas.novelty.cli:main"
atlas-dark    = "biosphere_atlas.dark.cli:main"
atlas-viewer  = "biosphere_atlas.viewer.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py39"
